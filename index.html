<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Materiali · Carpenteria Ticinese</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e7c86" />
  <link rel="manifest" href="manifest.json?v=7.4" />
  <link rel="icon" type="image/png" sizes="32x32" href="icone/icona-32.png?v=7.4" />
  <link rel="apple-touch-icon" href="icone/icona-180.png?v=7.4" />
  <meta name="apple-mobile-web-app-title" content="Materiali" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- ?v= : forza il browser a riprendere CSS/JS aggiornati. index.html resta in
       cache: dopo ogni caricamento su GitHub si apre con Ctrl+F5. -->
  <link rel="stylesheet" href="style.css?v=7.4" />
</head>
<body data-versione="7.4">

<!-- ═══ LOGIN ═══════════════════════════════════════════════════════════════ -->
<section id="pagina-login" class="pagina-centro" hidden>
  <div class="card-login">
    <div class="logo">📦 <strong>Materiali</strong><span>Carpenteria Ticinese</span></div>
    <form id="login-form" autocomplete="on">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required />
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required />
      <div id="login-banner" aria-live="polite" style="margin-top:12px"></div>
      <button id="login-btn" type="submit" class="btn btn-primario btn-largo" style="margin-top:8px">Entra</button>
      <p class="aiuto" style="margin-top:12px">Si entra con gli stessi email e password delle altre app. (Materiali, ex Radar, ex Fornitori.)</p>
      <p class="aiuto" id="versione-login" style="margin-top:4px"></p>
    </form>
  </div>
</section>

<!-- ═══ RUOLO NON AMMESSO ═══════════════════════════════════════════════════ -->
<section id="pagina-negato" class="pagina-centro" hidden>
  <div class="card-login">
    <div class="logo">📦 <strong>Materiali</strong><span>Carpenteria Ticinese</span></div>
    <div class="banner warn">🔒 Materiali è riservato a titolare e responsabile.</div>
    <p id="negato-dettaglio" class="dim"></p>
    <button type="button" class="btn btn-largo" id="negato-esci">🚪 Esci</button>
  </div>
</section>

<!-- ═══ APP ═════════════════════════════════════════════════════════════════ -->
<section id="pagina-app" hidden>
  <header id="topbar">
    <span class="titolo">📦 Materiali</span><span class="ver" id="versione-topbar"></span>
    <div class="utente">
      <span id="topbar-utente"></span>
      <button type="button" class="btn btn-piccolo" id="btn-esci">🚪 Esci</button>
    </div>
  </header>

  <nav id="menu" aria-label="Sezioni">
    <button type="button" data-vista="cerca">🔍 Cerca</button>
    <button type="button" data-vista="importa">📥 Importa offerta</button>
    <button type="button" data-vista="variazioni">📈 Variazioni</button>
    <button type="button" data-vista="fornitori">🏭 Fornitori</button>
    <button type="button" data-vista="documenti">📄 Documenti</button>
    <button type="button" data-vista="richieste">📝 Richiesta d'offerta</button>
    <button type="button" data-vista="impostazioni" id="menu-impostazioni" hidden>⚙️ Impostazioni</button>
  </nav>

  <main>
    <div id="banner-globale" aria-live="polite"></div>
    <div id="vista-cerca" class="vista"></div>
    <div id="vista-articolo" class="vista" hidden></div>
    <div id="vista-importa" class="vista" hidden></div>
    <div id="vista-variazioni" class="vista" hidden></div>
    <div id="vista-fornitori" class="vista" hidden></div>
    <div id="vista-fornitore" class="vista" hidden></div>
    <div id="vista-documenti" class="vista" hidden></div>
    <div id="vista-richieste" class="vista" hidden></div>
    <div id="vista-impostazioni" class="vista" hidden></div>
  </main>
</section>

<div id="finestre"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<!-- Supabase (versione fissa). SheetJS, pdf.js e Chart.js si caricano solo
     quando servono (vedi caricaLibreria in base.js). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="regola_prezzo.js?v=7.4"></script>
<script src="calcolo.js?v=7.4"></script>
<script src="base.js?v=7.4"></script>
<script src="cerca.js?v=7.4"></script>
<script src="fornitori.js?v=7.4"></script>
<script src="importa.js?v=7.4"></script>
<script src="variazioni.js?v=7.4"></script>
<script src="richieste.js?v=7.4"></script>
<script src="documenti.js?v=7.4"></script>
<script src="impostazioni.js?v=7.4"></script>
<script src="avvio.js?v=7.4"></script>
</body>
</html>
